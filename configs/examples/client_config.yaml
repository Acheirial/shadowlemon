# ShadowLemon 客户端配置（推荐格式：YAML）
# 中文说明见 rust/docs/config-v0.2.md

profiles:
  - profileName: default
    user:
      name: user1
      password: password1
    servers:
      - ipAddress: "12.34.56.78"
        domainName: ""
        portBindings:
          - portRange: "2012-2022"
            protocol: UDP
          - port: 2027
            protocol: UDP
    mtu: 1400
    multiplexing:
      level: MULTIPLEXING_HIGH
    handshakeMode: HANDSHAKE_NO_WAIT
    cipherSuites:
      - CIPHER_SUITE_XCHACHA20_POLY1305
      - CIPHER_SUITE_AES_256_GCM

activeProfile: default
socks5Port: 1080
loggingLevel: INFO
socks5ListenLAN: false
