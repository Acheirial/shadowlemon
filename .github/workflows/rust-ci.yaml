name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - 'test/**'
      - 'Makefile'
      - '.dockerignore'
      - '.github/workflows/rust-ci.yaml'
  pull_request:
    paths:
      - 'rust/**'
      - 'test/**'
      - 'Makefile'
      - '.dockerignore'
      - '.github/workflows/rust-ci.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target
      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Clippy (all targets and features)
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target
      - name: Workspace tests
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd rust
          cargo test --workspace

  build:
    name: release + embedded builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target
      - name: Release build
        working-directory: rust
        run: cargo build --workspace --release
      - name: Embedded profile build
        working-directory: rust
        run: cargo build --profile embedded --no-default-features --features embedded

  cross:
    name: musl cross ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target
          key: ${{ matrix.target }}
      - name: Install target std library
        run: rustup target add "${{ matrix.target }}"
      - name: Install cross
        run: cargo install cross --locked
      - name: Cross-link static binary
        working-directory: rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cross build -p shadowlemon --target "$TARGET" --profile embedded --no-default-features --features embedded

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_CONTAINER_IMAGE: shadowlemon_basic:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target
          key: integration
      - name: Build main and helper binaries
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          make test-binary
      - name: Build integration test image
        run: make test-container-image TEST_BINARY_PREREQ=
      - name: Run test/deploy/basic/test.sh in the image
        run: make run-container-test TEST_BINARY_PREREQ=
