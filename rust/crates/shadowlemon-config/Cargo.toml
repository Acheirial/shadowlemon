[package]
name = "shadowlemon-config"
description = "Configuration model, parsing and validation for ShadowLemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
embedded = []
android = []
windows = []
# Low-entropy traffic shaping in the protocol layer is feature-gated. When this
# feature is off, a configuration that requests a non-OFF low entropy mode is
# rejected by validation.
low-entropy = []

[dependencies]
base64 = "0.22"
clap.workspace = true
dirs = "6"
ipnet.workspace = true
serde.workspace = true
serde_json.workspace = true
shadowlemon-crypto.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
